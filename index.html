<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shanghai Metro + Walk Reachability</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app-shell">
      <aside id="panel">
        <h1>Shanghai Reachability</h1>
        <p class="subtitle">Apple-transit inspired style · Metro + Walk</p>

        <div class="control">
          <label for="timeBudget">Time Budget</label>
          <div class="slider-row">
            <input id="timeBudget" type="range" min="10" max="90" value="35" step="5" />
            <span id="timeValue">35 min</span>
          </div>
        </div>

        <div class="control">
          <label for="walkSpeed">Walking Speed</label>
          <select id="walkSpeed">
            <option value="65">Relaxed (3.9 km/h)</option>
            <option value="75" selected>Typical (4.5 km/h)</option>
            <option value="85">Fast (5.1 km/h)</option>
          </select>
        </div>

        <div class="control">
          <label for="originStation">Origin Station</label>
          <select id="originStation"></select>
          <p class="hint">Tip: click anywhere on the map to snap to nearest station.</p>
        </div>

        <div id="summary"></div>

        <div class="legend">
          <div><span class="dot metro"></span> Metro stations</div>
          <div><span class="dot reach"></span> Reachable by metro + walk</div>
          <div><span class="line"></span> Metro links</div>
        </div>
      </aside>
      <main id="map"></main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js"></script>
  </body>
</html>
